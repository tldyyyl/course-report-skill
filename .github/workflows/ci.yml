name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -v

  latex-smoke-test:
    name: XeLaTeX smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            poppler-utils \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-science \
            texlive-xetex

      - name: Generate and compile example report
        run: |
          python scripts/create_report.py \
            --output "$RUNNER_TEMP/course-report" \
            --school "示例大学" \
            --school-en "Example University" \
            --course "示例课程" \
            --title "课程报告自动化编译测试" \
            --author "测试学生" \
            --student-id "202600000001" \
            --advisor "测试教师" \
            --department "示例学院" \
            --major "示例专业" \
            --date "2026年6月12日" \
            --compiler xelatex
          test -s "$RUNNER_TEMP/course-report/main.pdf"

      - name: Render and inspect PDF pages
        run: |
          report_dir="$RUNNER_TEMP/course-report"
          render_dir="$report_dir/rendered-pages"
          mkdir -p "$render_dir"
          pdftoppm -png -r 120 \
            "$report_dir/main.pdf" \
            "$render_dir/page"

          page_count="$(pdfinfo "$report_dir/main.pdf" | awk '/^Pages:/ {print $2}')"
          test "$page_count" -ge 3
          test "$(find "$render_dir" -name 'page-*.png' -type f | wc -l)" -eq "$page_count"

          for page in $(seq 1 "$page_count"); do
            pdftotext -f "$page" -l "$page" \
              "$report_dir/main.pdf" \
              "$RUNNER_TEMP/page-$page.txt"
            grep -q '[^[:space:]]' "$RUNNER_TEMP/page-$page.txt"
          done

      - name: Upload compiled PDF and rendered pages
        uses: actions/upload-artifact@v7
        with:
          name: example-course-report
          path: |
            ${{ runner.temp }}/course-report/main.pdf
            ${{ runner.temp }}/course-report/rendered-pages/page-*.png
